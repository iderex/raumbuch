# The project, as record 0001 fixes it: Python 3 on CPython, a package under
# src/ and a console script over it.
#
# The interpreter version is in .python-version and the hash of every file of
# every distribution named below is in requirements.lock. This file says which
# distributions exist; those two say which version of each arrives. The `pin`
# leg of the gate refuses a disagreement in either direction.
#
# The distribution metadata a release needs is issue #96.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raumbuch"
version = "0.0.0"
description = "A verified catalogue of exact solutions of the Einstein field equations"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
# A floor rather than a pin, and the two are different statements. This line
# says which syntax the source may use; .python-version says which interpreter
# every run of the gate actually uses.
requires-python = ">=3.11"
# The symbolic algebra layer record 0001 chose, declared in the change that
# gave it a caller: the curvature of issue #44 is the first code behind the
# algebra boundary, and requirements.lock gains its hashes here rather than
# later. It is the only runtime dependency, and it is reached from exactly one
# directory, src/raumbuch/algebra/, which the `invariants` leg refuses the name
# of everywhere else.
dependencies = ["sympy"]

[project.optional-dependencies]
# The tools a check needs and a run of the library does not. Ruff is one tool
# doing both jobs, which is one dependency rather than two and one version to
# pin. No version is written here: requirements.lock is where every version and
# every hash sits, and a number written in a second place is a second place to
# change.
dev = ["ruff"]
# The workflow auditor. It is a guard's tool rather than a developer's, and it
# is declared here anyway, in its own group so that nothing installs it by
# accident. The argument is that a version is pinned in one file or it is pinned
# in several: zizmor's version was a literal in the workflow that used it, and
# the second workflow needing the same tool is what turns one literal into two
# that disagree. A group nobody installs still gets its version and its hashes
# from the same place as everything else.
audit = ["zizmor"]
# The tool that regenerates requirements.lock, which record 0001 requires to be
# in the lock itself. A lock produced by something unpinned is a lock whose
# contents were chosen by whatever version of the resolver ran that week.
lock = ["uv"]
# The JSON Schema validator the `schema` leg applies. It is the first
# dependency here with dependencies of its own, and the four it requires are
# not named beside it: this file says what the project chose, and
# requirements.lock says what that choice drags in, one `# via` comment per
# entry. The `pin` leg reads those comments, so a locked distribution is
# admissible either by being declared here or by a `# via` chain rooting in
# something that is.
schema = ["jsonschema"]

[project.scripts]
raumbuch = "raumbuch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The formatter and the linter, as the `format` and `lint` legs of the gate run
# them. Both refuse; neither advises.
[tool.ruff]
line-length = 88

# Python files and nothing else. Ruff also formats and lints code blocks inside
# Markdown, and the Markdown here is `docs/decisions/`, where a landed record is
# an argument somebody made and its examples are part of what was argued. A
# formatter that rewrites a decision record is editing a record, which record
# 0000 refuses. Nothing is lost: no Python this project runs lives in a document.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# Chosen, not accumulated. Each family is here for a failure it catches:
#   E, W   the style the formatter cannot express, including line length
#   F      undefined and unused names, which is the closest thing to a compiler
#          this means has, per record 0001
#   I      import order, so a diff never argues about it
#   UP     constructs the pinned interpreter has replaced
#   B      bugbear: mutable defaults, loop-variable capture, silent except
#   SIM    branches and comprehensions that say the same thing more simply
#   C4     comprehensions built the long way
#   RET    returns that disagree with each other inside one function
#   ARG    arguments nothing reads, which is usually a signature that moved
#   TID    relative imports, which make a module's home ambiguous
#   PL     pylint's set, whose refusals here are about size and structure
#   RUF    ruff's own, including unused noqa, so a suppression that stopped
#          being needed is refused rather than inherited
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "TID", "PL", "RUF",
]

# Every rule switched off is switched off here, with the reason. An empty list
# is the state to return to, and a rule added to it without a reason is not a
# decision anybody can review.
ignore = [
    # PLC0415: an import inside a function. Nothing needs one today, and the
    # rule is selected above through PL. It is listed here rather than left
    # implicit because a deferred import is how an optional dependency is
    # reached, and record 0010 keeps exactly one of those open. Switch it back
    # on for the tree and off at the one import when that arrives.
    "PLC0415",
]

# The pytest family is deliberately not selected. It rewrites unittest-style
# assertions into bare asserts, and the suite here is written on unittest so
# that it runs on a checkout with nothing installed, which is what keeps the
# dependency set empty for issue #27 to lock. Pytest collects these tests
# unchanged when issue #25 brings it, and the rules would then be arguing for a
# rewrite of a suite that already runs under both.

[tool.ruff.lint.per-file-ignores]
# A test asserts on the tree it is given, and a fixture leg takes the root every
# leg takes and reads none of it. That unused argument is the interface, not an
# oversight.
"tests/*" = ["ARG001"]
