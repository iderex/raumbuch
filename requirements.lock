# Every Python distribution this repository installs, pinned to one version and
# to the hash of every file that version publishes. Nothing is resolved at
# install time: pip is given --require-hashes, so a version that moved, a file
# that was replaced, or a name that resolves somewhere else is refused before
# anything is unpacked rather than after. Record 0001 fixes that route.
#
# The interpreter is not here. It is a version of a runtime rather than a
# distribution to install, so it sits in .python-version, which is the one file
# a workflow reads it out of.
#
# The set is what pyproject.toml declares, and the `pin` leg of the gate refuses
# a lockfile that does not match it: a name in the manifest and not here is a
# dependency arriving unpinned, and a name here and not in the manifest is a pin
# for something nothing installs.
#
# Every file of every version is pinned rather than only the ones a runner
# happens to fetch, so the gate on a machine this project has not been run on
# yet meets a pin rather than a resolution.
#
# Regenerating it is not automatic and is not meant to be. Bumping a version is
# a change somebody argues for in an issue. The tool that regenerates it is uv,
# which is in the lock below, per record 0001:
#
#     uv pip compile --generate-hashes --all-extras pyproject.toml
#
# with one thing done by hand. That command compiles what the project depends
# on, and setuptools is what builds it, so the build requirement is added here
# beside the rest rather than left as the one unpinned artefact in the install.
