name: pin

# One version of anything, in one file, read by everything else. The job below
# carries no logic: it asks the gate verb for the `pin` leg, which reads
# .python-version, requirements.lock and pyproject.toml and refuses a workflow
# that names a version instead of reading one.
#
# This job installs nothing. The leg reads files, and installing the project in
# order to judge the pin would be resolving a dependency in the one job whose
# subject is that nothing is resolved.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the leg reads the pin files and the workflows and writes nothing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: toolchain pin
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Read out of the pin file, which is also this job's subject: a job
          # judging the pin while running on an interpreter chosen elsewhere
          # would be the drift it is looking for.
          python-version-file: .python-version
      - name: Judge the pin
        # --require turns a leg that did not run into a refusal. Without it a
        # checkout arriving without the workflows directory would be green over
        # a set nothing had read.
        env:
          PYTHONPATH: src
        run: python3 -m raumbuch gate --only pin --require pin
