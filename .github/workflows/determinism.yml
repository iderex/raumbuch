name: determinism

# Record 0012: two runs of the same input produce the same record. The job below
# carries no logic of its own. It asks the gate verb for the `determinism` leg,
# which replays every declared input twice in one run, with a different hash seed
# and a different worker count, and compares the two with the excluded fields
# removed. So what refuses on a runner is the same code that refuses before a
# push, and the seeds and worker counts are declared in one place rather than in
# a workflow file that would drift from it.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the leg reads the tree, renders in subprocesses, and writes nothing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Determinism replay
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Install the project
        # No development extra: this leg needs the package and the standard
        # library and nothing else. No version is written here; they are declared
        # in pyproject.toml and pinned by issue #27.
        run: python3 -m pip install --disable-pip-version-check -e .
      - name: Replay every input twice, with a different hash seed and a different worker count
        # --require turns a leg that did not run into a refusal. Without it a job
        # whose interpreter could not spawn the replay would be green over a
        # property nothing asked about, which is the failure this whole check is
        # built against. The report line names both runs, so what was varied is
        # in the log rather than only in the source.
        run: python3 -m raumbuch gate --only determinism --require determinism
