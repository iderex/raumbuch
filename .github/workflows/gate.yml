name: gate

# The gate is one verb of the project. This workflow runs that verb and carries
# no leg of its own, so there is one procedure and not a copy of it in YAML that
# drifts from the one a contributor runs before a push.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the gate reads the checkout and writes nothing.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a new push does not queue behind an
# obsolete verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Install the project and its development extra
        # A leg whose tool is absent reports that it did not run, and this job
        # would then be green over a set it did not cover. So the extra is
        # installed and the green here means every declared leg ran. No version
        # is written: they are declared in pyproject.toml and pinned by #27.
        run: python3 -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run the gate
        run: python3 -m raumbuch gate
