name: gate

# The gate is one verb of the project. This workflow runs that verb and carries
# no leg of its own, so there is one procedure and not a copy of it in YAML that
# drifts from the one a contributor runs before a push.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the gate reads the checkout and writes nothing.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a new push does not queue behind an
# obsolete verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The version is read out of the pin file rather than written here.
          # A number in a workflow is the second copy the pin exists to prevent,
          # and the `pin` leg refuses one.
          python-version-file: .python-version
      - name: Install the pinned tools and the project
        # Two commands and one procedure. The first installs every distribution
        # this repository pins, with --require-hashes, so a version that moved or
        # a file that was replaced is refused before anything is unpacked. The
        # second installs the package itself with no resolution of its own: it
        # has no dependencies, and its build backend came from the line above.
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python3 -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Run the gate
        run: python3 -m raumbuch gate
