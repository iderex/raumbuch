name: isolation

# Record 0014 says the test suite makes no network connection, and issue #29 is
# the check that refuses a violation of it.
#
# The denial is made here and never by the code being judged. A flag the suite
# sets on itself is read after the interpreter has started, and the call this
# check exists to catch is the one inside a dependency at import time, which
# runs first. So the suite is run inside a container with `--network none`,
# which gives it a network namespace holding a loopback interface and nothing
# else: there is no route out, and no interface for a route to be added to.
#
# The container is started by hand rather than declared as the job's container,
# because the job container is attached to a network this runner creates and
# `--network none` cannot be asked of it. Everything the project needs is in the
# image and on the volume, so nothing inside the container has to fetch
# anything: the package is pure standard library and runs from `src/` per
# record 0001.
#
# The gate verb is asked for the `network` leg and required to run it. The leg
# establishes that there is no route, runs a fixture that tries to open a
# connection and has to fail, and then runs the whole unit suite in that
# namespace. A leg that did not run becomes a refusal, so a container that
# quietly kept its network reddens rather than reporting green over a contract
# nothing asked about.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the leg reads the tree, runs subprocesses over it, and writes
# nothing back to it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network:
    name: No network in the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Fetch the image, which is the last thing that reaches anything
        # Pulled in its own step so that the run below has nothing left to
        # fetch, and so that a pull failure is not read as a network refusal.
        # The image carries no digest; pinning what this project runs on is
        # issue #27, and this is one of the places it will reach.
        run: docker pull python:3

      - name: Run the suite in a namespace with no route out of it
        # --network none is the denial. --user keeps the run unprivileged, which
        # is the contract the `headless` leg judges and which the suite asserts
        # from inside this run as well. HOME is set because the image's default
        # user has one and 1001 does not.
        run: |
          docker run --rm --network none \
            --user 1001:1001 \
            --volume "$PWD:/raumbuch" --workdir /raumbuch \
            --env PYTHONPATH=src --env HOME=/tmp \
            python:3 python3 -m raumbuch gate --only network --require network
