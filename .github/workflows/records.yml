name: records

# Record 0000 fixes the shape of a decision record, and a shape nothing refuses
# is an explanation rather than a rule. The job below carries no logic of its
# own: it asks the gate verb for the `records` leg, which reads the required
# sections and the allowed status words out of record 0000 itself. So what
# refuses on a runner is the same code that refuses before a push, and there is
# no copy of the required section list anywhere for a record to drift against.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Read-only: the leg reads the records and the index and writes nothing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  records:
    name: Decision records are well formed
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The version is read out of the pin file rather than written here.
          # A number in a workflow is the second copy the pin exists to prevent,
          # and the `pin` leg refuses one.
          python-version-file: .python-version
      - name: Install the pinned tools and the project
        # Two commands and one procedure. The first installs every distribution
        # this repository pins, with --require-hashes, so a version that moved or
        # a file that was replaced is refused before anything is unpacked. The
        # second installs the package itself with no resolution of its own: it
        # has no dependencies, and its build backend came from the line above.
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements.lock
          python3 -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Judge every decision record against record 0000
        # --require turns a leg that did not run into a refusal. Without it a job
        # whose checkout arrived without the records directory would be green
        # over a set nothing had read.
        run: python3 -m raumbuch gate --only records --require records
